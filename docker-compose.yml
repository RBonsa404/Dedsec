version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: dedsec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dedsec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dedsec_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dedsec_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dedsec}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: dedsec-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dedsec_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dedsec_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create default MinIO bucket
  minio-init:
    image: minio/mc:latest
    container_name: dedsec-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set dedsec http://minio:9000 $${MINIO_ROOT_USER:-dedsec_minio} $${MINIO_ROOT_PASSWORD:-dedsec_minio_secret};
      mc mb dedsec/dedsec-files --ignore-existing;
      mc anonymous set download dedsec/dedsec-files;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
